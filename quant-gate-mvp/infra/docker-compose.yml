version: '3.9'
services:
  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    working_dir: /app
    depends_on:
      - db
  web:
    build: ./apps/web
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    working_dir: /app
    depends_on:
      - api
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    ports:
      - "5432:5432"
